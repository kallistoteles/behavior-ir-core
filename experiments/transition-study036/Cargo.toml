[package]
name = "transition-study036"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[workspace]
exclude = ["oracle", "private/core", "private/core/crates/*"]

[dependencies]
behavior-engine = { git = "https://github.com/kallistoteles/behavior-ir-core", rev = "63a8c164523275e06ac1d7dc5330db4a899c9d99", features = ["research035"] }
behavior-models = { git = "https://github.com/kallistoteles/behavior-ir", rev = "8c0849fb82343ddf5a4dd99b5070ee985f8ebff0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["unbounded_depth"] }
sha2 = "=0.10.9"
thiserror = "=2.0.21"

[patch."https://github.com/kallistoteles/behavior-ir-core"]
behavior-engine = { path = "private/core/crates/behavior-engine" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
debug = 0
lto = false

[features]
worker = []

[[bin]]
name = "transition036-reference"
path = "src/bin/reference.rs"
required-features = ["worker"]

[[bin]]
name = "transition036-reuse"
path = "src/bin/reuse.rs"
required-features = ["worker"]

[[test]]
name = "protocol"
path = "tests/protocol.rs"

[[test]]
name = "native_exactness"
path = "tests/native_exactness.rs"

[[test]]
name = "oracle_contract"
path = "tests/oracle_contract.rs"

[[bin]]
name = "transition036-buffered"
path = "src/bin/buffered.rs"
required-features = ["worker"]

[[test]]
name = "v2_sessions"
path = "tests/v2_sessions.rs"

[[test]]
name = "v2_recovery"
path = "tests/v2_recovery.rs"

[[test]]
name = "v2_session_worker"
path = "tests/v2_session_worker.rs"

[[test]]
name = "v2_session_recovery_worker"
path = "tests/v2_session_recovery_worker.rs"

[[test]]
name = "v2_session_resources"
path = "tests/v2_session_resources.rs"

[[test]]
name = "v2_recovery_input_shape"
path = "tests/v2_recovery_input_shape.rs"

[[test]]
name = "v2_native_spans"
path = "tests/v2_native_spans.rs"
