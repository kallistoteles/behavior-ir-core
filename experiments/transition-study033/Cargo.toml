[package]
name = "core-proof-feasibility033"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace]
exclude = ["vendor/nova"]

[dependencies]
behavior-core = { path = "../../crates/behavior-core" }
behavior-store = { path = "../../crates/behavior-store" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
sha2 = "=0.10.9"
nova-snark = { git = "https://github.com/microsoft/Nova.git", rev = "01b1e2d662a847ed7029770ecbaf6687398899dd", default-features = false }
ff = "=0.13.1"
bincode = { version = "=2.0.1", features = ["serde"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }

[dev-dependencies]
proptest = "=1.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
