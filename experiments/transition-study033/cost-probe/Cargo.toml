[package]
name = "core033-portable-numeric-cost"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace]

[[bin]]
name = "numeric_cost_portable"
path = "../src/bin/numeric_cost.rs"

[dependencies]
nova-snark = { path = "../vendor/nova", default-features = false }
ff = "=0.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
bincode = { version = "=2.0.1", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[[bin]]
name = "stock_sha_shape"
path = "sha_shape.rs"

[[bin]]
name = "numeric_cost_export"
path = "numeric_cost_export.rs"

[[bin]]
name = "numeric_consumer"
path = "numeric_consumer.rs"

[[bin]]
name = "numeric_hash_chain"
path = "numeric_hash_chain.rs"

[[bin]]
name = "ipa_fold_cost"
path = "ipa_fold_cost.rs"

[[bin]]
name = "numeric_cost_pp_export"
path = "numeric_cost_pp_export.rs"

[[bin]]
name = "numeric_pp_consumer"
path = "numeric_pp_consumer.rs"

[[bin]]
name = "identity_cost_export"
path = "identity_cost_export.rs"
