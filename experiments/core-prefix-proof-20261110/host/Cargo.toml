[package]
name="core-actual-prefix-client"
version="0.1.0"
edition="2024"
publish=false
[workspace]
[dependencies]
risc0-zkvm={version="=3.0.6",default-features=false,features=["client","disable-dev-mode"]}
risc0-binfmt="=3.0.5"
risc0-zkos-v1compat="=2.2.3"
serde={version="=1.0.229",features=["derive"]}
serde_json="=1.0.151"
bincode={version="=2.0.1",features=["serde"]}
sha2="=0.10.9"
[[bin]]
name="core_prefix_client"
path="src/main.rs"
[profile.release]
debug=0
lto=false
